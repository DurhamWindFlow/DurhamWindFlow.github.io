# Durham WindFlow website — Jekyll configuration.
#
# Content is NOT edited here. People, publications and research themes live in
# the DurhamWindFlow/.github repository under Profile/data/, and are copied
# into _data/ by .github/workflows/sync-content.yml. See README.md.

title: Durham WindFlow
tagline: Atmospheric Flow and Wind Energy Dynamics Group
description: >-
  Durham WindFlow is a multidisciplinary group at Durham University working on the
  fluid mechanics of wind energy — wind-farm aerodynamics, atmospheric boundary
  layer flows, geophysical fluid dynamics, and AI for energy infrastructure.

url: https://durhamwindflow.github.io
baseurl: ""

github_org: https://github.com/DurhamWindFlow

nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: People
    url: /people/
  - title: Publications
    url: /publications/
  - title: Join us
    url: /contact/

plugins:
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
